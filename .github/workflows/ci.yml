name: ci

# Fast PR gate: compile + the non-Testcontainers unit/arch suite (every *Test class).
# The full Testcontainers integration suite (every *IT class) runs in full-ci.yml on
# push to main / on demand, and in money-ci.yml on PRs touching money-critical paths.
# This split keeps per-PR Actions minutes low without losing main-branch IT coverage.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit + arch (no Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: ./gradlew test --tests "*Test" (unit + arch, no Docker)
        run: ./gradlew test --tests "*Test" --no-daemon --stacktrace
        # *Test = pure unit + ArchUnit classes (no @SpringBootTest / Testcontainers).
        # *IT integration classes are excluded here and run in full-ci.yml (main / on
        # demand) + money-ci.yml (PRs touching money paths). With no -Dtest.shard.total
        # set, build.gradle's CI shard-exclude closure is a no-op on this lane.

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
