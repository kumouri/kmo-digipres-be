name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: ./gradlew build
        run: ./gradlew build --no-daemon --stacktrace
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Upload generated OpenAPI spec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: build/openapi/openapi.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        # always() (not failure()) so a *cancelled* job still uploads the reports —
        # cancellation skips failure()-gated steps, which was hiding the full stack
        # traces needed to diagnose CI failures. Pre-existing; widened during Phase A.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
