name: cd

# Continuous Delivery: build the boot jar and (gated) deploy to the prod box.
# Triggers on every merge to main (Git Flow release gate passed) and on demand.
#
# The build job always runs — it produces and uploads the fat jar artifact for traceability.
# The deploy job is GATED OFF by default behind repo variable PROD_DEPLOY_ENABLED; see the
# LOUD comment on that job for full enabling instructions.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build boot jar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # CI-05 pattern: cache Gradle user home + build cache for compile reuse (mirrors ci.yml / full-ci.yml).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ./gradlew bootJar
        run: ./gradlew bootJar --no-daemon --stacktrace

      - name: Stage artifact
        run: cp build/libs/*.jar be-app.jar

      - name: Write step summary
        run: |
          echo "## CD build summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Jar SHA-256** | \`$(sha256sum be-app.jar | awk '{print $1}')\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: be-app-jar
          path: be-app.jar
          retention-days: 30

  # ============================================================
  # DEPLOY JOB — GATED OFF BY DEFAULT
  # ============================================================
  # This job is OFF unless the repo variable PROD_DEPLOY_ENABLED is set to 'true'.
  #
  # STATUS: UNVERIFIED — this job has never been enabled or run.
  # It mirrors the manual runbook in kmosf-hq ops/z2-crm/README.md.
  # Enabling it requires the owner to configure the following in the repo
  # (Settings → Secrets and variables → Actions):
  #
  #   REPO VARIABLE:
  #     PROD_DEPLOY_ENABLED = true
  #
  #   SECRETS (all required before enabling):
  #     PROD_SSH_KEY          — private key for the kmosf user on kmosf-prod-01 (Ed25519/RSA)
  #     PROD_SSH_HOST         — prod box IP or hostname (e.g. 5.78.75.49)
  #     PROD_SSH_USER         — SSH user (e.g. kmosf)
  #     PROD_SSH_KNOWN_HOSTS  — output of: ssh-keyscan <PROD_SSH_HOST>
  #
  # The deploy flow:
  #   1. SCP the fat jar to /opt/kmosf/z2-build/be-app.jar
  #   2. SCP deploy/be.Dockerfile to /opt/kmosf/z2-build/be.Dockerfile
  #   3. SSH: docker build → docker compose up -d be → health-check logs
  #
  # This mirrors the build-crm.sh + docker compose up workflow in kmosf-hq ops/z2-crm.
  # No third-party SSH actions are used — plain ssh/scp with key written to ~/.ssh.
  # ============================================================
  deploy:
    name: deploy to prod (gated)
    needs: build
    if: vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: be-app-jar

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: SCP jar to prod
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            be-app.jar \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/opt/kmosf/z2-build/be-app.jar

      - name: SCP Dockerfile to prod
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            deploy/be.Dockerfile \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/opt/kmosf/z2-build/be.Dockerfile

      - name: Build image + restart BE on prod
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
            'cd /opt/kmosf/z2-build && docker build -f be.Dockerfile -t kmo-digipres-be:kmosf . && cd /opt/kmosf && docker compose up -d be && sleep 20 && docker compose ps be && docker compose logs --tail 30 be'

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
