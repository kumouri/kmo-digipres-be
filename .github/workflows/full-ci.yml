name: full-ci

# The full Testcontainers suite (every *IT + *Test class), sharded. Triggers:
#   * push to main      — post-merge gate (merge commits are new, untested SHAs); also
#                         the only place docs/api/openapi.json is refreshed.
#   * workflow_dispatch — run the full suite on demand (e.g. before merging a risky branch).
#   * workflow_call     — reused by money-ci.yml for PRs touching money-critical paths.
# Sharded across 8 jobs (2026-06-10). The suite grew to ~284 *IT/*Test classes, each
# spinning up cached @SpringBootTest contexts in a SINGLE-fork JVM (maxParallelForks=1
# is REQUIRED so the static singleton Testcontainers are shared — see build.gradle).
# When a shard packs too many distinct-context module ITs, JVM memory/GC pressure builds
# until Testcontainers' Ryuk loses its heartbeat and reaps the Mongo container a few
# minutes in; every remaining test then hits a 30s MongoTimeout and the job is
# force-cancelled at timeout-minutes. Two mitigations are in play:
#   * TESTCONTAINERS_RYUK_DISABLED (env below) — a GC pause can no longer reap Mongo
#     mid-run; leak cleanup is unnecessary on ephemeral CI runners (the VM is destroyed).
#   * 8 shards — cuts each JVM's context/heap peak (2 shards reaped every run 2026-06-08;
#     4 still reaped the heaviest at 30-min; 6 still let UNTIMED new ITs name-hash-cluster
#     onto shards 2-3 on 2026-06-10, blowing their heap until Mongo timed out). Bumped 6->8
#     for headroom as the suite keeps growing (T13/T14 still to land).
#   * COMPLETE timings file — gradle/test-shard-timings.properties now covers all ~284
#     classes (was 205; ~78 recent ITs were untimed => name-hash-scattered, defeating the
#     LPT runtime balancer entirely). REGENERATE it after large test additions from a green
#     full-ci run's test-results XMLs (sum each suite's `time`, fold nested into top-level;
#     see build.gradle), else new classes name-hash onto arbitrary shards and re-break this.
on:
  push:
    branches: [main]
    # CI-02: doc-only merges (CLAUDE.md, .claude/**, docs/**) change neither compiled code
    # nor the OpenAPI surface, so they skip the ~50-billable-min full suite. Mirrors ci.yml's
    # fast-lane filter; any code change lives outside these paths => still gated every merge.
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  # CI-03: in a merge train only the newest main tree needs the full suite — cancel
  # superseded in-flight runs instead of validating every intermediate SHA. A red batch then
  # blames N merges at once; re-run full-ci via workflow_dispatch on a suspect SHA to bisect.
  # (money-ci reuses this workflow per-PR-ref, where cancel-on-new-push is also correct.)
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

# Ephemeral CI runners are torn down after each job, so Testcontainers' Ryuk resource
# reaper is redundant here — and under heavy GC it can drop its heartbeat and kill the
# shared Mongo container mid-run. Disable it so a slow shard cannot reap its own database.
env:
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  test:
    name: gradle test (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # CI-05: setup-gradle caches the Gradle user home (dependencies + the local build
      # cache), restoring main's warm cache on branches. Replaces setup-java's `cache: gradle`.
      # With --build-cache below, unchanged sources => compile/resource cache hits, cutting
      # the ~2-4 min/shard recompile across all 8 shards and subsequent runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ./gradlew test (shard ${{ matrix.shard }}/8)
        run: ./gradlew test -Dtest.shard.index=${{ matrix.shard }} -Dtest.shard.total=8 --build-cache --no-daemon --stacktrace
        # Each shard runs in a fresh runner with its own Docker engine => its own
        # singleton Testcontainers Mongo/Kafka. maxParallelForks=1 is preserved within
        # each shard; isolation is across jobs, not JVM forks. Ryuk is disabled (env
        # above); the ephemeral runner teardown reaps containers instead.

      - name: Upload test reports (shard ${{ matrix.shard }})
        # CI-07: only on failure/cancellation — a green shard's reports go unused, and this
        # step otherwise runs 8x every run. cancelled() is kept so a reaped shard still uploads
        # the diagnostics needed to tell a real failure from a Mongo-timeout cascade.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-shard-${{ matrix.shard }}
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  openapi:
    name: openapi spec (export + refresh)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # CI-05: see the test job — cache the Gradle user home + build cache for compile reuse.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Export spec via OpenApiEndpointIT then refresh docs/api/openapi.json
        run: ./gradlew test --tests "*OpenApiEndpointIT" verifyOpenApi --build-cache --no-daemon --stacktrace
        # OpenApiEndpointIT exports build/openapi/openapi.json during the Testcontainers
        # phase; verifyOpenApi (mustRunAfter 'test') then copies it to docs/api/openapi.json.

      - name: Upload generated OpenAPI spec
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: build/openapi/openapi.json
          if-no-files-found: ignore
          retention-days: 14

  ci-gate:
    name: ci gate (all shards + openapi)
    needs: [test, openapi]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          echo "shards=${{ needs.test.result }} openapi=${{ needs.openapi.result }}"
          [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.openapi.result }}" = "success" ]
