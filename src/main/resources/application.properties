spring.application.name=kmo-digipres-be

# Phase E (E-D5) — Quartz scheduler config. RAM-FALLBACK ACTIVE (the plan-authorized
# E-D5 outcome). The quartz-mongodb coordinate RESOLVES
# (io.fluidsonic.mirror:quartz-mongodb:2.2.0-rc2) and the Mongo store LOADS, but it
# was compiled against Quartz 2.3.2 and Spring Boot 3.5.6 manages Quartz 2.5.0 which
# removed JobDetail.isConcurrentExectionDisallowed() — every trigger fire throws
# NoSuchMethodError in com.novemberain.quartz.mongodb.LockManager, so NO job runs
# under the Mongo store (see the build.gradle block for the full trace + rationale).
#
# Money-durability of recurring billing does NOT depend on the JobStore: it lives in
# the RecurringInvoiceOccurrence unique-indexed Mongo ledger + RecurringInvoice
# nextRunAt cursor (E-D2/E-D3). A stateless RAM-store trigger re-running runDueOnce()
# hourly reconciles from that ledger every tick (bounded catch-up) — the
# ServiceAgreementSchedulerService model; fully money-correct.
#
# kmosf.quartz.store=memory is the default. kmosf.quartz.store=mongo is wired in
# QuartzConfig (com.novemberain.quartz.mongodb.MongoDBJobStore, collectionPrefix
# quartz_) and ready the day a Quartz-2.5-compatible quartz-mongodb appears — flip
# this flag, re-add the build.gradle dependency, and uncomment the Mongo-collection
# assertions in QuartzMongoJobStoreIT. No spring.quartz.job-store-type here — the
# raw org.quartz.jobStore.class set by the customizer is authoritative.
kmosf.quartz.store=${KMOSF_QUARTZ_STORE:memory}
spring.quartz.auto-startup=true
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.scheduler.instanceName=KmosQuartzScheduler
# Proof-job flag — disable in tests that don't want the background job noise
kmosf.quartz.proof-job.enabled=${KMOSF_QUARTZ_PROOF_JOB_ENABLED:true}

# Phase E — RecurringInvoice spawn job (E-D3). The Quartz RecurringInvoiceSpawnJob
# materializes one DRAFT invoice per cadence period. enabled=false (set in ITs)
# disables the background trigger so RecurringInvoiceSpawnService.runDueOnce() can
# be driven deterministically. interval-ms is the repeat period (default 1h);
# initial-delay-ms delays the first fire past boot. max-catchup bounds the number
# of catch-up invoices materialized per template per tick (one per missed period,
# never merged) so a long-dormant template can't flood billing in one tick.
kmosf.recurring-invoice.spawn-job.enabled=${KMOSF_RECURRING_INVOICE_SPAWN_JOB_ENABLED:true}
kmosf.recurring-invoice.spawn-job.interval-ms=${KMOSF_RECURRING_INVOICE_SPAWN_INTERVAL_MS:3600000}
kmosf.recurring-invoice.spawn-job.initial-delay-ms=${KMOSF_RECURRING_INVOICE_SPAWN_INITIAL_DELAY_MS:60000}
kmosf.recurring-invoice.max-catchup=${KMOSF_RECURRING_INVOICE_MAX_CATCHUP:12}

# Phase E — billing-stripe module gate. Controls the RecurringInvoiceController,
# the Stripe-checkout endpoint, and the debug accounting-push endpoint
# (@ConditionalOnProperty, matchIfMissing=true so it is on by default like the
# other module surfaces). The Stripe webhook path is the existing /public/**
# permitAll rule and is NOT gated by this.
kmosf.modules.billing-stripe.enabled=${KMOSF_MODULE_BILLING_STRIPE:true}

# Phase F — contracts module gate. Controls ContractController and
# ContractTemplateController (@ConditionalOnProperty, matchIfMissing=true so the
# contracts vertical is on by default). The Documenso webhook path is the existing
# /public/** permitAll rule and is NOT gated by this — the per-tenant
# IntegrationConnection(provider="documenso") is the real gate.
kmosf.modules.contracts.enabled=${KMOSF_MODULE_CONTRACTS:true}

# Phase 1 (NMM AI intake) — voicemail-intake module gate. Controls the service-layer
# feature (TwilioVoicemailService) via @ConditionalOnProperty (matchIfMissing=true so
# the voicemail-to-lead pipeline is on by default like the other module surfaces). The
# Twilio voice + voicemail webhook controllers themselves live under the existing
# /public/** permitAll rule and are NOT gated by this — the per-tenant
# IntegrationConnection(provider="twilio") authToken is the real gate (request-signature
# verify before any effect). The voicemail-greeting copy is configurable so the spoken
# message is not hardcoded for NMM.
kmosf.modules.voicemail-intake.enabled=${KMOSF_MODULE_VOICEMAIL_INTAKE:true}
kmosf.voicemail.greeting=${KMOSF_VOICEMAIL_GREETING:Thank you for calling. Please leave a message with your name, address, and a description of your mole or pest problem after the beep, and we will call you back.}
kmosf.voicemail.record-max-length-seconds=${KMOSF_VOICEMAIL_RECORD_MAX_LENGTH_SECONDS:120}
kmosf.voicemail.auto-ack-message=${KMOSF_VOICEMAIL_AUTO_ACK_MESSAGE:Thanks for calling No Mo Mole — we got your message and will call you back.}
# AI extraction model for the voicemail transcript → structured-lead step. Defaults to
# Haiku (cheap; the AnthropicAiAssistService summarize-model default). The Anthropic
# base-url is the SHARED kmosf.ai.anthropic.base-url below (overridden → WireMock in
# every test); no host hardcoded.
kmosf.voicemail.extraction-model=${KMOSF_VOICEMAIL_EXTRACTION_MODEL:claude-haiku-4-5}

# E2 — Inbound Responder + Intent Router (the shared inbound-SMS responder engine). Controls
# ResponderConfigController + the ResponderAutoConfiguration beans (@ConditionalOnProperty,
# matchIfMissing=true so the engine is present by default like the other module surfaces). The
# generic inbound delegation only ACTIVATES for a tenant that has a ResponderConfig row — a tenant
# with no config (or enabled=false / empty intents) behaves byte-identically to before this engine
# existed (the IGNORED fallthrough). The inbound webhook itself is the existing
# TwilioInboundSmsController (REUSED) under /public/**; the per-tenant IntegrationConnection(twilio)
# authToken signature-verify is the real ingress gate. The property is set explicitly (not omitted)
# so the controller's InboundSmsModuleEnabledCondition.ResponderEnabled nested condition matches by
# default. The classifier's Anthropic base-url is the SHARED kmosf.ai.anthropic.base-url below
# (overridden → WireMock in every test); no host hardcoded; no live send in CI.
kmosf.modules.responder.enabled=${KMOSF_MODULE_RESPONDER:true}
# Classifier model for the free-text → intent step. Defaults to Haiku (cheap; the per-tenant
# ResponderConfig.model overrides this when set).
kmosf.responder.classify-model=${KMOSF_RESPONDER_CLASSIFY_MODEL:claude-haiku-4-5}
# How long an idle conversation-state thread lives before the Mongo TTL index reaps it (refreshed
# each inbound turn). ISO-8601 duration; default 24h.
kmosf.responder.conversation-ttl=${KMOSF_RESPONDER_CONVERSATION_TTL:PT24H}
# The generic default-handoff reply sent to the sender when no specific handler matched / intent
# UNKNOWN (the "a team member will follow up" safety net). Configurable so it is not hardcoded.
kmosf.responder.handoff-reply=${KMOSF_RESPONDER_HANDOFF_REPLY:Thanks for your message! A team member will follow up with you shortly.}

# "Get Paid" AR / collections module (band 4600-4619) — tiered overdue-invoice dunning.
#
# DEFAULT-OFF (a money / customer-facing-comms module — the CoverageNudgeJob / GbpReviewPoller
# posture). There is deliberately NO kmosf.modules.ar.enabled line here: both the
# ArAutoConfiguration (module definition) and the scheduled ArAgingSweepJob are gated
# @ConditionalOnProperty(prefix="kmosf.modules.ar", name="enabled", matchIfMissing=false), so
# absence of the property = the module + sweep beans are NOT created in CI / any default run → no
# aging sweep, no SENT->OVERDUE transition, no dunning (non-AR tenants byte-identical, §7 satisfied
# by construction). Opt the module in per-deployment with KMOSF_MODULES_AR_ENABLED=true (or
# --kmosf.modules.ar.enabled=true). (Mirrors how coverage-nudge / mole-tripwire / gbp-reviews carry
# no enabled line.) The sweep's tunables fall back to in-code @Value defaults when unset:
#   kmosf.modules.ar.grace-days        (default 0)        — extra days past dueAt before D3 counts
#   kmosf.modules.ar.interval-ms       (default 86400000) — @Scheduled fixed delay (24h)
#   kmosf.modules.ar.initial-delay-ms  (default 60000)    — @Scheduled initial delay

# AI Proposal / SOW generator module (band 4620-4639) — discovery notes -> an AI-drafted, scoped,
# line-item-priced SOW (a DRAFT Quote + SowDraft prose).
#
# DEFAULT-OFF (a day-one productization bet; per-tenant opt-in — the AR / demo-module convention).
# There is deliberately NO kmosf.modules.proposals.enabled line here: both the
# ProposalsAutoConfiguration (module definition + the ProposalDraftService bean) and the
# ProposalDraftController are gated @ConditionalOnProperty(prefix="kmosf.modules.proposals",
# name="enabled", matchIfMissing=false), so absence of the property = the module beans + routes are
# NOT created in CI / any default run -> no draft service, no /proposals/** routes (non-proposals
# tenants byte-identical; §7 no-live-external satisfied by construction — the Anthropic call only
# exists when the module is on, and its base-url is WireMock-overridden in tests). Opt the module in
# per-deployment with KMOSF_MODULES_PROPOSALS_ENABLED=true (or --kmosf.modules.proposals.enabled=true).
# (Mirrors how ar / coverage-nudge / gbp-reviews carry no enabled line.) The draft tunables fall back
# to in-code @Value defaults when unset:
#   kmosf.modules.proposals.draft-model     (default claude-sonnet-4-6) — the Sonnet model for drafting
#   kmosf.modules.proposals.max-notes-chars (default 8000)              — discovery-notes length cap (4621)
#   kmosf.modules.proposals.draft-system-prompt (default in-code)       — optional strict-JSON prompt override

# NMM GBP review-reply automation — Google Business Profile review-reply pipeline.
# Per-tenant Google credentials live in IntegrationConnection(provider="google-business")
# (secrets.accessToken/refreshToken + optional config.locationName); these are the global
# config shared across tenants.
#
# DEFAULT-OFF poller (the ImapInboundPoller / CoverageNudgeJob posture). There is deliberately
# NO kmosf.modules.gbp-reviews.enabled line here: the GbpReviewPoller is gated
# @ConditionalOnProperty(matchIfMissing=false), so absence of the property = the poller bean is
# NOT created in CI / any default run → NO live Google fetch (§7 satisfied by construction).
# Opt the poller in per-deployment with KMOSF_MODULES_GBP_REVIEWS_ENABLED=true (or
# --kmosf.modules.gbp-reviews.enabled=true). The admin approve/post controller is gated on the
# SAME property but @ConditionalOnProperty(matchIfMissing=TRUE) — so absence of the property leaves
# the always-registerable admin surface ON while the poller stays OFF (the two are intentionally
# decoupled by their differing matchIfMissing). Setting the property to false explicitly turns BOTH
# off. (Mirrors how coverage-nudge / mole-tripwire / mole-triage carry no enabled line.)
# When true, the poller posts the freshly-drafted reply back to Google immediately (status
# POSTED). Default false = leave the draft DRAFTED for Rob to approve via the admin endpoint.
kmosf.modules.gbp-reviews.auto-post=${KMOSF_GBP_REVIEWS_AUTO_POST:false}
kmosf.modules.gbp-reviews.poll-interval-ms=${KMOSF_GBP_REVIEWS_POLL_INTERVAL_MS:900000}
kmosf.modules.gbp-reviews.initial-delay-ms=${KMOSF_GBP_REVIEWS_INITIAL_DELAY_MS:60000}
# GBP API base URL. Default is a non-routable .invalid placeholder — NEVER a real Google host
# (§7 hard no-live-Google boundary). Per-tenant IntegrationConnection.config["apiBaseUrl"] takes
# precedence; in every test/CI run this is overridden to the WireMock base URL via
# @DynamicPropertySource. No code path hardcodes a real GBP host; accessToken is a sandbox fake.
# Wiring live Google OAuth/GBP access is a separate, Google-approval-gated human action.
kmosf.gbp.api-base-url=${KMOSF_GBP_API_BASE_URL:https://gbp.googleapis.invalid}
kmosf.gbp.request-timeout-seconds=${KMOSF_GBP_REQUEST_TIMEOUT_SECONDS:10}
# OAuth2 token refresh. When a GBP call 401s, GbpTokenService POSTs grant_type=refresh_token here
# (the per-tenant refreshToken + the global OAuth-app client-id/secret) and persists the rotated
# accessToken to IntegrationConnection(google-business).secrets. token-url defaults to a non-routable
# .invalid placeholder — NEVER a real Google host (§7; the real value is
# https://oauth2.googleapis.com/token); overridden -> WireMock in every test. client-id/secret are
# KMOSF's single Google-Cloud OAuth app (the same for every tenant, the QuickBooks posture); blank by
# default, sandbox fakes in tests. No host/secret hardcoded; no live OAuth in the impl loop.
kmosf.gbp.token-url=${KMOSF_GBP_TOKEN_URL:https://oauth2.googleapis.invalid/token}
kmosf.gbp.client-id=${KMOSF_GBP_CLIENT_ID:}
kmosf.gbp.client-secret=${KMOSF_GBP_CLIENT_SECRET:}
# AI model for the review-reply draft step. Defaults to Sonnet (outbound prose quality matters,
# the AnthropicAiAssistService draft-model default). The Anthropic base-url is the SHARED
# kmosf.ai.anthropic.base-url below (overridden -> WireMock in every test); no host hardcoded.
kmosf.gbp.draft-model=${KMOSF_GBP_DRAFT_MODEL:claude-sonnet-4-6}
# Optional override for the review-reply system prompt. Blank = the built-in warm, concise,
# professional small-local-business reply voice in GbpReplyDraftService.
kmosf.gbp.reply-system-prompt=${KMOSF_GBP_REPLY_SYSTEM_PROMPT:}

# E3 Review Engine — post-visit review-REQUEST delivery + sentiment triage + per-entity insights.
# Builds additively on the GBP review pipeline above. The ReviewRequestService creator runs always
# (a harmless PENDING row on completion), but the SENDER is DEFAULT-OFF: there is deliberately NO
# kmosf.modules.review-engine.sender-enabled line here, so the ReviewRequestSenderJob bean is NOT
# created in CI / any default run (the CoverageNudgeJob / gbp-reviews-poller posture) -> NO live
# review-request SMS unless a deployment opts in (KMOSF_MODULES_REVIEW_ENGINE_SENDER_ENABLED=true).
# The per-tenant Google review LINK is read from IntegrationConnection(twilio).config["reviewLink"]
# (NOT hardcoded); a tenant with no reviewLink is skipped. The request SMS carries NO incentive
# (Google's 2026 policy bans review incentives). {link} is substituted with the tenant's review link.
kmosf.review-engine.request-delay=${KMOSF_REVIEW_ENGINE_REQUEST_DELAY:PT24H}
kmosf.review-engine.request-message=${KMOSF_REVIEW_ENGINE_REQUEST_MESSAGE:Thanks for choosing us! If you have a moment, we'd really appreciate a quick Google review — it helps your neighbors find us. {link}}
kmosf.review-engine.max-per-contact-per-window=${KMOSF_REVIEW_ENGINE_MAX_PER_CONTACT:1}
kmosf.review-engine.window-hours=${KMOSF_REVIEW_ENGINE_WINDOW_HOURS:720}
kmosf.review-engine.send-interval-ms=${KMOSF_REVIEW_ENGINE_SEND_INTERVAL_MS:3600000}
kmosf.review-engine.initial-delay-ms=${KMOSF_REVIEW_ENGINE_INITIAL_DELAY_MS:60000}
# Sentiment triage. The sentiment is computed on every ingested review and stored on GbpReviewReply
# (rating-first: >=4 POSITIVE, ==3 NEUTRAL, <=2 NEGATIVE). The OPTIONAL best-effort AI refinement of a
# commented review is DEFAULT-OFF (ai-refine-enabled) so the poller adds ZERO extra Anthropic calls by
# default — opt in per-deployment. The negative manager ALERT is also DEFAULT-OFF (negative-alert-enabled)
# because the poller already notifies Rob on every new review; opt in to add a dedicated negative alert
# (email + SMS to the per-tenant Twilio config notifyEmail/notifyPhone). A review with rating <= the
# threshold (or AI-classified NEGATIVE) is "negative".
kmosf.review-engine.ai-refine-enabled=${KMOSF_REVIEW_ENGINE_AI_REFINE_ENABLED:false}
kmosf.review-engine.negative-alert-enabled=${KMOSF_REVIEW_ENGINE_NEGATIVE_ALERT_ENABLED:false}
kmosf.review-engine.negative-rating-threshold=${KMOSF_REVIEW_ENGINE_NEGATIVE_RATING_THRESHOLD:3}
# Optional override for the sentiment-classification system prompt + the model used for the optional
# best-effort AI refinement of a commented review. Blank prompt = the built-in classifier prompt;
# the Anthropic base-url is the SHARED kmosf.ai.anthropic.base-url below (-> WireMock in every test).
kmosf.review-engine.sentiment-model=${KMOSF_REVIEW_ENGINE_SENTIMENT_MODEL:claude-haiku-4-5}
kmosf.review-engine.sentiment-system-prompt=${KMOSF_REVIEW_ENGINE_SENTIMENT_SYSTEM_PROMPT:}

# Resilience4j circuit breaker for outbound GBP calls. Programmatic registry — GbpApiClient
# looks up "gbp-reviews" from CircuitBreakerRegistry (the stripe-checkout / quickbooks-invoice
# pattern).
resilience4j.circuitbreaker.instances.gbp-reviews.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gbp-reviews.sliding-window-size=20
resilience4j.circuitbreaker.instances.gbp-reviews.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.gbp-reviews.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.instances.gbp-reviews.max-attempts=3
resilience4j.retry.instances.gbp-reviews.wait-duration=1s
resilience4j.retry.instances.gbp-reviews.exponential-backoff-multiplier=2

# Phase A — OpenAPI / Springdoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/openapi
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=false
spring.data.mongodb.uri=mongodb://localhost:27017/
spring.data.mongodb.database=kmo-digipres-be
spring.data.mongodb.auto-index-creation=true
server.port=8080
spring.webflux.base-path=/api/v1

kmosf.mail.smtp.host=${KMOSF_MAIL_SMTP_HOST:smtp.protonmail.ch}
kmosf.mail.smtp.port=${KMOSF_MAIL_SMTP_PORT:587}
kmosf.mail.smtp.username=${KMOSF_MAIL_SMTP_USERNAME:info@kmodigitalpresence.com}
kmosf.mail.smtp.password=${KMOSF_MAIL_SMTP_PASSWORD:}

# Phase A — Auth mode switch.
# kmosf.auth.mode: "local" (default, HS256 self-issued JWTs) or "zitadel" (JWKS-backed).
# In "zitadel" mode, kmosf.auth.zitadel.jwks-uri is required (fails fast at startup if blank).
# Full Zitadel federation (claim mapping, JIT provisioning) is Phase A2 — not yet built.
kmosf.auth.mode=${KMOSF_AUTH_MODE:local}
kmosf.auth.zitadel.issuer-uri=${KMOSF_AUTH_ZITADEL_ISSUER_URI:}
kmosf.auth.zitadel.jwks-uri=${KMOSF_AUTH_ZITADEL_JWKS_URI:}

# JWT — HS256 signing secret. Must be >= 256 bits (32 chars) in production.
# A safe random default is used when unset so dev boots, but startup logs a WARN.
kmosf.jwt.secret=${KMOSF_JWT_SECRET:}
kmosf.jwt.issuer=${KMOSF_JWT_ISSUER:kmosf-crm}
kmosf.jwt.ttl-seconds=${KMOSF_JWT_TTL_SECONDS:43200}

# Public widget token signing secret (Phase 9b). HMAC-SHA256 key for tokens issued
# to tenants for embedding in their site's widget snippets. Unset = a random secret
# is generated at boot and a WARN is logged (issued tokens invalidate on restart;
# fine for dev, unsuitable for prod).
kmosf.security.widget-token-secret=${KMOSF_WIDGET_TOKEN_SECRET:}

# Postmark house API token (Phase 9c). Used by TransactionalEmailService for
# tenants that have not configured their own IntegrationConnection(provider=postmark).
# Unset = sends 412 errorCode=1701 until a tenant connects their own account.
kmosf.email.postmark.house-token=${KMOSF_POSTMARK_HOUSE_TOKEN:}

# Anthropic AI house API key (Phase 9f). Used by AnthropicAiAssistService for
# tenants that have not configured their own IntegrationConnection(provider=anthropic).
# Unset = AI returns 412 errorCode=1203 until a tenant connects their own account.
kmosf.ai.anthropic.house-key=${KMOSF_ANTHROPIC_HOUSE_KEY:}
kmosf.ai.anthropic.summarize-model=${KMOSF_ANTHROPIC_SUMMARIZE_MODEL:claude-haiku-4-5}
kmosf.ai.anthropic.draft-model=${KMOSF_ANTHROPIC_DRAFT_MODEL:claude-sonnet-4-6}
# Anthropic Messages API base URL. Default is the real Anthropic endpoint but it is
# OVERRIDDEN to the WireMock base URL in every test/CI run (§7 hard no-live-AI boundary)
# — no code path hardcodes api.anthropic.com. Shared by AnthropicAiAssistService and the
# Phase-1 VoicemailExtractionService. (Previously only a @Value default on
# AnthropicAiAssistService; surfaced here for one-place configurability.)
kmosf.ai.anthropic.base-url=${KMOSF_ANTHROPIC_BASE_URL:https://api.anthropic.com/v1/messages}

# Bootstrap-only — token required to call POST /tenants.
kmosf.bootstrap.token=${KMOSF_BOOTSTRAP_TOKEN:}

# CORS — comma-separated origins permitted to call /api from a browser.
kmosf.cors.allowed-origins=${KMOSF_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# HIPAA read-access audit trail (Security Rule audit controls, 45 CFR 164.312(b)).
# When true, AccessAuditWebFilter records one append-only AccessAuditEvent per completed,
# authenticated request (who read which record, when) — the read-side complement to the
# always-on entity AuditEvent (CREATE/UPDATE/DELETE). OFF by default: no filter bean, no
# per-request overhead, no events. Opt in per deployment. Retention: 730-day TTL.
kmosf.audit.access-tracking.enabled=${KMOSF_AUDIT_ACCESS_TRACKING:false}

# Modules — global toggles. Per-tenant enablement is layered on top via Tenant.enabledModules.
kmosf.modules.field-service.enabled=${KMOSF_MODULE_FIELD_SERVICE:false}
kmosf.modules.home-services.enabled=${KMOSF_MODULE_HOME_SERVICES:false}
kmosf.modules.salon-spa.enabled=${KMOSF_MODULE_SALON_SPA:false}
kmosf.modules.restaurant-light.enabled=${KMOSF_MODULE_RESTAURANT_LIGHT:false}
# ChairFill (salon flagship). Rides the salon-spa module (a chairfill tenant needs BOTH
# salon-spa AND chairfill in Tenant.enabledModules). Default off; no chairfill bean is
# created unless this is true. CF-1: nightly no-show risk model + BOOKING_RISK_SCORED.
kmosf.modules.chairfill.enabled=${KMOSF_MODULE_CHAIRFILL:false}
# T6 Salon "ReviewBoost" — the salon deployment of the E3 review engine, surfaced as a
# per-stylist review dashboard (GET /chairfill/reviewboost/{insights,config}, ADMIN). Gated
# by the chairfill flag above + @ConditionalOnBean(SalonBookingService) (salon-spa loaded);
# there is deliberately NO separate reviewboost flag — it is part of the ChairFill flagship.
# The per-tenant Google review link the E3 sender uses lives on the Twilio
# IntegrationConnection config["reviewLink"]; the request-SMS sender / AI-sentiment-refine /
# negative-alert remain E3's default-OFF flags (kmosf.modules.review-engine.sender-enabled,
# kmosf.review-engine.ai-refine-enabled, kmosf.review-engine.negative-alert-enabled).

# QuickBooks Online (Phase 10d). Independent of the home-services module — a tenant
# can have QBO connected without the home-services vertical enabled. Per-tenant
# credentials live in IntegrationConnection(provider="quickbooks"); these are the
# global config shared across tenants.
kmosf.integrations.quickbooks.enabled=${KMOSF_INTEGRATIONS_QUICKBOOKS_ENABLED:false}
kmosf.integrations.quickbooks.client-id=${KMOSF_QUICKBOOKS_CLIENT_ID:}
kmosf.integrations.quickbooks.client-secret=${KMOSF_QUICKBOOKS_CLIENT_SECRET:}
kmosf.integrations.quickbooks.redirect-uri=${KMOSF_QUICKBOOKS_REDIRECT_URI:http://localhost:8080/api/v1/public/integrations/quickbooks/oauth/callback}
kmosf.integrations.quickbooks.api-base-url=${KMOSF_QUICKBOOKS_API_BASE_URL:https://quickbooks.api.intuit.com}
kmosf.integrations.quickbooks.oauth-base-url=${KMOSF_QUICKBOOKS_OAUTH_BASE_URL:https://oauth.platform.intuit.com}
kmosf.integrations.quickbooks.authorization-base-url=${KMOSF_QUICKBOOKS_AUTH_BASE_URL:https://appcenter.intuit.com}
kmosf.integrations.quickbooks.state-signing-secret=${KMOSF_QUICKBOOKS_STATE_SECRET:}
kmosf.integrations.quickbooks.state-ttl-seconds=${KMOSF_QUICKBOOKS_STATE_TTL_SECONDS:600}
kmosf.integrations.quickbooks.refresh-skew-seconds=${KMOSF_QUICKBOOKS_REFRESH_SKEW_SECONDS:300}

# Resilience4j circuit breaker for outbound QBO calls. Programmatic registry —
# QuickBooksInvoiceSync looks up "quickbooks-invoice" from CircuitBreakerRegistry.
# Defaults follow the Phase 6 WebhookDeliveryService block (50% over 20 calls
# in 60s opens the breaker). Tune via env in prod if Intuit throttles.
resilience4j.circuitbreaker.instances.quickbooks-invoice.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.quickbooks-invoice.sliding-window-size=20
resilience4j.circuitbreaker.instances.quickbooks-invoice.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.quickbooks-invoice.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.instances.quickbooks-invoice.max-attempts=3
resilience4j.retry.instances.quickbooks-invoice.wait-duration=1s
resilience4j.retry.instances.quickbooks-invoice.exponential-backoff-multiplier=2

# Stripe (Phase E — E-D9). Per-tenant credentials live in IntegrationConnection
# (provider="stripe"): secrets.apiKey (StripeCheckoutService) +
# secrets.webhookSigningSecret (StripeWebhookService). These are the global values.
# api-base-url defaults to the real Stripe API but is OVERRIDDEN to the WireMock
# base URL in every test/CI run — no code path hardcodes api.stripe.com, no test
# can initiate a real charge (§7 hard no-live-money boundary). Wiring a live key
# / a real charge is a separate human action, never the implementation loop.
kmosf.stripe.api-base-url=${KMOSF_STRIPE_API_BASE_URL:https://api.stripe.com}
kmosf.stripe.request-timeout-seconds=${KMOSF_STRIPE_REQUEST_TIMEOUT_SECONDS:10}

# Resilience4j circuit breaker for outbound Stripe checkout calls. Programmatic
# registry — StripeCheckoutService looks up "stripe-checkout" from
# CircuitBreakerRegistry (the QuickBooksInvoiceSync "quickbooks-invoice" pattern).
resilience4j.circuitbreaker.instances.stripe-checkout.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.stripe-checkout.sliding-window-size=20
resilience4j.circuitbreaker.instances.stripe-checkout.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.stripe-checkout.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.instances.stripe-checkout.max-attempts=3
resilience4j.retry.instances.stripe-checkout.wait-duration=1s
resilience4j.retry.instances.stripe-checkout.exponential-backoff-multiplier=2

# Square POS integration. Per-tenant OAuth tokens live in IntegrationConnection
# (provider="square"); these are global app credentials from the Square Developer Dashboard.
kmosf.integrations.square.enabled=${KMOSF_INTEGRATIONS_SQUARE_ENABLED:false}
kmosf.integrations.square.client-id=${SQUARE_CLIENT_ID:}
kmosf.integrations.square.client-secret=${SQUARE_CLIENT_SECRET:}
kmosf.integrations.square.redirect-uri=${SQUARE_REDIRECT_URI:http://localhost:8080/api/v1/public/integrations/square/oauth/callback}
kmosf.integrations.square.api-base-url=${SQUARE_API_BASE_URL:https://connect.squareup.com}
kmosf.integrations.square.state-signing-secret=${SQUARE_STATE_SECRET:}
kmosf.integrations.square.state-ttl-seconds=${SQUARE_STATE_TTL_SECONDS:600}
kmosf.integrations.square.webhook-signature-key=${SQUARE_WEBHOOK_SIG_KEY:}
kmosf.integrations.square.webhook-url=${SQUARE_WEBHOOK_URL:}
kmosf.integrations.square.refresh-skew-seconds=${SQUARE_REFRESH_SKEW_SECONDS:300}

# Field-service module: S3-compatible storage for capture (photo/signature) refs.
# AWS S3, Cloudflare R2, MinIO etc. all work — set endpoint accordingly.
kmosf.files.region=${KMOSF_FILES_REGION:us-east-1}
kmosf.files.bucket=${KMOSF_FILES_BUCKET:}
kmosf.files.endpoint=${KMOSF_FILES_ENDPOINT:}
kmosf.files.access-key=${KMOSF_FILES_ACCESS_KEY:}
kmosf.files.secret-key=${KMOSF_FILES_SECRET_KEY:}
kmosf.files.upload-ttl-seconds=${KMOSF_FILES_UPLOAD_TTL:600}

# Client portal — OAuth (Google + Microsoft), magic-link, WebAuthn (passkeys).
# Tenant resolved from host subdomain for pre-auth portal endpoints
# (e.g. acme.crm.kmosf.dev -> "acme"); JWT-based tenant resolution still
# applies once a portal session is established. See PortalSecurityConfig.
kmosf.portal.enabled=${KMOSF_PORTAL_ENABLED:true}
kmosf.portal.base-host=${KMOSF_PORTAL_BASE_HOST:crm.kmosf.dev}
kmosf.portal.success-redirect=${KMOSF_PORTAL_SUCCESS_REDIRECT:/portal/}
kmosf.portal.failure-redirect=${KMOSF_PORTAL_FAILURE_REDIRECT:/portal/login}
kmosf.portal.signup-policy-default=${KMOSF_PORTAL_SIGNUP_POLICY:INVITE_ONLY}
kmosf.portal.invitation-ttl-hours=${KMOSF_PORTAL_INVITATION_TTL_HOURS:72}
kmosf.portal.magic-link-ttl-minutes=${KMOSF_PORTAL_MAGIC_LINK_TTL_MINUTES:15}
kmosf.portal.jwt-cookie-name=${KMOSF_PORTAL_JWT_COOKIE_NAME:kmosf_portal_session}
kmosf.portal.jwt-cookie-secure=${KMOSF_PORTAL_JWT_COOKIE_SECURE:true}
kmosf.portal.jwt-cookie-domain=${KMOSF_PORTAL_JWT_COOKIE_DOMAIN:}

# WebAuthn / passkey relying-party config. Origins must match the FE host(s).
kmosf.portal.webauthn.rp-id=${KMOSF_PORTAL_WEBAUTHN_RP_ID:crm.kmosf.dev}
kmosf.portal.webauthn.rp-name=${KMOSF_PORTAL_WEBAUTHN_RP_NAME:KMOSF Portal}
kmosf.portal.webauthn.allowed-origins=${KMOSF_PORTAL_WEBAUTHN_ALLOWED_ORIGINS:https://crm.kmosf.dev,https://localhost:5173}
kmosf.portal.webauthn.challenge-ttl-seconds=${KMOSF_PORTAL_WEBAUTHN_CHALLENGE_TTL_SECONDS:300}

# OAuth providers — credentials must be set via env to actually enable a provider.
# Registration is conditional on a non-blank client-id, so dev/test profiles boot
# fine without any OAuth credentials and the portal falls back to magic-link only.
# The portal flow uses a single fixed redirect per provider; tenant is carried in
# the signed `state` parameter (see PortalOAuthAuthorizationRequestResolver).
kmosf.portal.oauth.google.client-id=${KMOSF_OAUTH_GOOGLE_CLIENT_ID:}
kmosf.portal.oauth.google.client-secret=${KMOSF_OAUTH_GOOGLE_CLIENT_SECRET:}
kmosf.portal.oauth.microsoft.client-id=${KMOSF_OAUTH_MICROSOFT_CLIENT_ID:}
kmosf.portal.oauth.microsoft.client-secret=${KMOSF_OAUTH_MICROSOFT_CLIENT_SECRET:}
# Microsoft uses /common/v2.0 for multi-tenant (Entra work/school + personal MSA).
# Tokens carry a per-Azure-tenant iss; OAuthClientRegistrationConfig accepts the family.
kmosf.portal.oauth.microsoft.issuer-uri=${KMOSF_OAUTH_MICROSOFT_ISSUER:https://login.microsoftonline.com/common/v2.0}
# H.6 — Zitadel portal OIDC (opt-in per tenant via Tenant.zitadelOrgId).
# Registration is conditional on a non-blank client-id + client-secret.
# issuer-uri must point at the Zitadel project issuer (default: non-routable .invalid;
# override in production with KMOSF_OAUTH_ZITADEL_PORTAL_ISSUER). No host hardcoded.
kmosf.portal.oauth.zitadel.client-id=${KMOSF_OAUTH_ZITADEL_PORTAL_CLIENT_ID:}
kmosf.portal.oauth.zitadel.client-secret=${KMOSF_OAUTH_ZITADEL_PORTAL_CLIENT_SECRET:}
kmosf.portal.oauth.zitadel.issuer-uri=${KMOSF_OAUTH_ZITADEL_PORTAL_ISSUER:}
