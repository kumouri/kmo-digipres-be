spring.application.name=kmo-digipres-be

# Phase E (E-D5) — Quartz scheduler config. RAM-FALLBACK ACTIVE (the plan-authorized
# E-D5 outcome). The quartz-mongodb coordinate RESOLVES
# (io.fluidsonic.mirror:quartz-mongodb:2.2.0-rc2) and the Mongo store LOADS, but it
# was compiled against Quartz 2.3.2 and Spring Boot 3.5.6 manages Quartz 2.5.0 which
# removed JobDetail.isConcurrentExectionDisallowed() — every trigger fire throws
# NoSuchMethodError in com.novemberain.quartz.mongodb.LockManager, so NO job runs
# under the Mongo store (see the build.gradle block for the full trace + rationale).
#
# Money-durability of recurring billing does NOT depend on the JobStore: it lives in
# the RecurringInvoiceOccurrence unique-indexed Mongo ledger + RecurringInvoice
# nextRunAt cursor (E-D2/E-D3). A stateless RAM-store trigger re-running runDueOnce()
# hourly reconciles from that ledger every tick (bounded catch-up) — the
# ServiceAgreementSchedulerService model; fully money-correct.
#
# kmosf.quartz.store=memory is the default. kmosf.quartz.store=mongo is wired in
# QuartzConfig (com.novemberain.quartz.mongodb.MongoDBJobStore, collectionPrefix
# quartz_) and ready the day a Quartz-2.5-compatible quartz-mongodb appears — flip
# this flag, re-add the build.gradle dependency, and uncomment the Mongo-collection
# assertions in QuartzMongoJobStoreIT. No spring.quartz.job-store-type here — the
# raw org.quartz.jobStore.class set by the customizer is authoritative.
kmosf.quartz.store=${KMOSF_QUARTZ_STORE:memory}
spring.quartz.auto-startup=true
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.scheduler.instanceName=KmosQuartzScheduler
# Proof-job flag — disable in tests that don't want the background job noise
kmosf.quartz.proof-job.enabled=${KMOSF_QUARTZ_PROOF_JOB_ENABLED:true}

# Phase E — RecurringInvoice spawn job (E-D3). The Quartz RecurringInvoiceSpawnJob
# materializes one DRAFT invoice per cadence period. enabled=false (set in ITs)
# disables the background trigger so RecurringInvoiceSpawnService.runDueOnce() can
# be driven deterministically. interval-ms is the repeat period (default 1h);
# initial-delay-ms delays the first fire past boot. max-catchup bounds the number
# of catch-up invoices materialized per template per tick (one per missed period,
# never merged) so a long-dormant template can't flood billing in one tick.
kmosf.recurring-invoice.spawn-job.enabled=${KMOSF_RECURRING_INVOICE_SPAWN_JOB_ENABLED:true}
kmosf.recurring-invoice.spawn-job.interval-ms=${KMOSF_RECURRING_INVOICE_SPAWN_INTERVAL_MS:3600000}
kmosf.recurring-invoice.spawn-job.initial-delay-ms=${KMOSF_RECURRING_INVOICE_SPAWN_INITIAL_DELAY_MS:60000}
kmosf.recurring-invoice.max-catchup=${KMOSF_RECURRING_INVOICE_MAX_CATCHUP:12}

# Phase E — billing-stripe module gate. Controls the RecurringInvoiceController,
# the Stripe-checkout endpoint, and the debug accounting-push endpoint
# (@ConditionalOnProperty, matchIfMissing=true so it is on by default like the
# other module surfaces). The Stripe webhook path is the existing /public/**
# permitAll rule and is NOT gated by this.
kmosf.modules.billing-stripe.enabled=${KMOSF_MODULE_BILLING_STRIPE:true}

# Phase F — contracts module gate. Controls ContractController and
# ContractTemplateController (@ConditionalOnProperty, matchIfMissing=true so the
# contracts vertical is on by default). The Documenso webhook path is the existing
# /public/** permitAll rule and is NOT gated by this — the per-tenant
# IntegrationConnection(provider="documenso") is the real gate.
kmosf.modules.contracts.enabled=${KMOSF_MODULE_CONTRACTS:true}

# Phase A — OpenAPI / Springdoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/openapi
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=false
spring.data.mongodb.uri=mongodb://localhost:27017/
spring.data.mongodb.database=kmo-digipres-be
spring.data.mongodb.auto-index-creation=true
server.port=8080
spring.webflux.base-path=/api/v1

kmosf.mail.smtp.host=${KMOSF_MAIL_SMTP_HOST:smtp.protonmail.ch}
kmosf.mail.smtp.port=${KMOSF_MAIL_SMTP_PORT:587}
kmosf.mail.smtp.username=${KMOSF_MAIL_SMTP_USERNAME:info@kmodigitalpresence.com}
kmosf.mail.smtp.password=${KMOSF_MAIL_SMTP_PASSWORD:}

# Phase A — Auth mode switch.
# kmosf.auth.mode: "local" (default, HS256 self-issued JWTs) or "zitadel" (JWKS-backed).
# In "zitadel" mode, kmosf.auth.zitadel.jwks-uri is required (fails fast at startup if blank).
# Full Zitadel federation (claim mapping, JIT provisioning) is Phase A2 — not yet built.
kmosf.auth.mode=${KMOSF_AUTH_MODE:local}
kmosf.auth.zitadel.issuer-uri=${KMOSF_AUTH_ZITADEL_ISSUER_URI:}
kmosf.auth.zitadel.jwks-uri=${KMOSF_AUTH_ZITADEL_JWKS_URI:}

# JWT — HS256 signing secret. Must be >= 256 bits (32 chars) in production.
# A safe random default is used when unset so dev boots, but startup logs a WARN.
kmosf.jwt.secret=${KMOSF_JWT_SECRET:}
kmosf.jwt.issuer=${KMOSF_JWT_ISSUER:kmosf-crm}
kmosf.jwt.ttl-seconds=${KMOSF_JWT_TTL_SECONDS:43200}

# Public widget token signing secret (Phase 9b). HMAC-SHA256 key for tokens issued
# to tenants for embedding in their site's widget snippets. Unset = a random secret
# is generated at boot and a WARN is logged (issued tokens invalidate on restart;
# fine for dev, unsuitable for prod).
kmosf.security.widget-token-secret=${KMOSF_WIDGET_TOKEN_SECRET:}

# Postmark house API token (Phase 9c). Used by TransactionalEmailService for
# tenants that have not configured their own IntegrationConnection(provider=postmark).
# Unset = sends 412 errorCode=1701 until a tenant connects their own account.
kmosf.email.postmark.house-token=${KMOSF_POSTMARK_HOUSE_TOKEN:}

# Anthropic AI house API key (Phase 9f). Used by AnthropicAiAssistService for
# tenants that have not configured their own IntegrationConnection(provider=anthropic).
# Unset = AI returns 412 errorCode=1203 until a tenant connects their own account.
kmosf.ai.anthropic.house-key=${KMOSF_ANTHROPIC_HOUSE_KEY:}
kmosf.ai.anthropic.summarize-model=${KMOSF_ANTHROPIC_SUMMARIZE_MODEL:claude-haiku-4-5}
kmosf.ai.anthropic.draft-model=${KMOSF_ANTHROPIC_DRAFT_MODEL:claude-sonnet-4-6}

# Bootstrap-only — token required to call POST /tenants.
kmosf.bootstrap.token=${KMOSF_BOOTSTRAP_TOKEN:}

# CORS — comma-separated origins permitted to call /api from a browser.
kmosf.cors.allowed-origins=${KMOSF_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Modules — global toggles. Per-tenant enablement is layered on top via Tenant.enabledModules.
kmosf.modules.field-service.enabled=${KMOSF_MODULE_FIELD_SERVICE:false}
kmosf.modules.home-services.enabled=${KMOSF_MODULE_HOME_SERVICES:false}
kmosf.modules.salon-spa.enabled=${KMOSF_MODULE_SALON_SPA:false}
kmosf.modules.restaurant-light.enabled=${KMOSF_MODULE_RESTAURANT_LIGHT:false}

# QuickBooks Online (Phase 10d). Independent of the home-services module — a tenant
# can have QBO connected without the home-services vertical enabled. Per-tenant
# credentials live in IntegrationConnection(provider="quickbooks"); these are the
# global config shared across tenants.
kmosf.integrations.quickbooks.enabled=${KMOSF_INTEGRATIONS_QUICKBOOKS_ENABLED:false}
kmosf.integrations.quickbooks.client-id=${KMOSF_QUICKBOOKS_CLIENT_ID:}
kmosf.integrations.quickbooks.client-secret=${KMOSF_QUICKBOOKS_CLIENT_SECRET:}
kmosf.integrations.quickbooks.redirect-uri=${KMOSF_QUICKBOOKS_REDIRECT_URI:http://localhost:8080/api/v1/public/integrations/quickbooks/oauth/callback}
kmosf.integrations.quickbooks.api-base-url=${KMOSF_QUICKBOOKS_API_BASE_URL:https://quickbooks.api.intuit.com}
kmosf.integrations.quickbooks.oauth-base-url=${KMOSF_QUICKBOOKS_OAUTH_BASE_URL:https://oauth.platform.intuit.com}
kmosf.integrations.quickbooks.authorization-base-url=${KMOSF_QUICKBOOKS_AUTH_BASE_URL:https://appcenter.intuit.com}
kmosf.integrations.quickbooks.state-signing-secret=${KMOSF_QUICKBOOKS_STATE_SECRET:}
kmosf.integrations.quickbooks.state-ttl-seconds=${KMOSF_QUICKBOOKS_STATE_TTL_SECONDS:600}
kmosf.integrations.quickbooks.refresh-skew-seconds=${KMOSF_QUICKBOOKS_REFRESH_SKEW_SECONDS:300}

# Resilience4j circuit breaker for outbound QBO calls. Programmatic registry —
# QuickBooksInvoiceSync looks up "quickbooks-invoice" from CircuitBreakerRegistry.
# Defaults follow the Phase 6 WebhookDeliveryService block (50% over 20 calls
# in 60s opens the breaker). Tune via env in prod if Intuit throttles.
resilience4j.circuitbreaker.instances.quickbooks-invoice.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.quickbooks-invoice.sliding-window-size=20
resilience4j.circuitbreaker.instances.quickbooks-invoice.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.quickbooks-invoice.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.instances.quickbooks-invoice.max-attempts=3
resilience4j.retry.instances.quickbooks-invoice.wait-duration=1s
resilience4j.retry.instances.quickbooks-invoice.exponential-backoff-multiplier=2

# Stripe (Phase E — E-D9). Per-tenant credentials live in IntegrationConnection
# (provider="stripe"): secrets.apiKey (StripeCheckoutService) +
# secrets.webhookSigningSecret (StripeWebhookService). These are the global values.
# api-base-url defaults to the real Stripe API but is OVERRIDDEN to the WireMock
# base URL in every test/CI run — no code path hardcodes api.stripe.com, no test
# can initiate a real charge (§7 hard no-live-money boundary). Wiring a live key
# / a real charge is a separate human action, never the implementation loop.
kmosf.stripe.api-base-url=${KMOSF_STRIPE_API_BASE_URL:https://api.stripe.com}
kmosf.stripe.request-timeout-seconds=${KMOSF_STRIPE_REQUEST_TIMEOUT_SECONDS:10}

# Resilience4j circuit breaker for outbound Stripe checkout calls. Programmatic
# registry — StripeCheckoutService looks up "stripe-checkout" from
# CircuitBreakerRegistry (the QuickBooksInvoiceSync "quickbooks-invoice" pattern).
resilience4j.circuitbreaker.instances.stripe-checkout.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.stripe-checkout.sliding-window-size=20
resilience4j.circuitbreaker.instances.stripe-checkout.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.stripe-checkout.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.instances.stripe-checkout.max-attempts=3
resilience4j.retry.instances.stripe-checkout.wait-duration=1s
resilience4j.retry.instances.stripe-checkout.exponential-backoff-multiplier=2

# Square POS integration. Per-tenant OAuth tokens live in IntegrationConnection
# (provider="square"); these are global app credentials from the Square Developer Dashboard.
kmosf.integrations.square.enabled=${KMOSF_INTEGRATIONS_SQUARE_ENABLED:false}
kmosf.integrations.square.client-id=${SQUARE_CLIENT_ID:}
kmosf.integrations.square.client-secret=${SQUARE_CLIENT_SECRET:}
kmosf.integrations.square.redirect-uri=${SQUARE_REDIRECT_URI:http://localhost:8080/api/v1/public/integrations/square/oauth/callback}
kmosf.integrations.square.api-base-url=${SQUARE_API_BASE_URL:https://connect.squareup.com}
kmosf.integrations.square.state-signing-secret=${SQUARE_STATE_SECRET:}
kmosf.integrations.square.state-ttl-seconds=${SQUARE_STATE_TTL_SECONDS:600}
kmosf.integrations.square.webhook-signature-key=${SQUARE_WEBHOOK_SIG_KEY:}
kmosf.integrations.square.webhook-url=${SQUARE_WEBHOOK_URL:}
kmosf.integrations.square.refresh-skew-seconds=${SQUARE_REFRESH_SKEW_SECONDS:300}

# Field-service module: S3-compatible storage for capture (photo/signature) refs.
# AWS S3, Cloudflare R2, MinIO etc. all work — set endpoint accordingly.
kmosf.files.region=${KMOSF_FILES_REGION:us-east-1}
kmosf.files.bucket=${KMOSF_FILES_BUCKET:}
kmosf.files.endpoint=${KMOSF_FILES_ENDPOINT:}
kmosf.files.access-key=${KMOSF_FILES_ACCESS_KEY:}
kmosf.files.secret-key=${KMOSF_FILES_SECRET_KEY:}
kmosf.files.upload-ttl-seconds=${KMOSF_FILES_UPLOAD_TTL:600}

# Client portal — OAuth (Google + Microsoft), magic-link, WebAuthn (passkeys).
# Tenant resolved from host subdomain for pre-auth portal endpoints
# (e.g. acme.crm.kmosf.dev -> "acme"); JWT-based tenant resolution still
# applies once a portal session is established. See PortalSecurityConfig.
kmosf.portal.enabled=${KMOSF_PORTAL_ENABLED:true}
kmosf.portal.base-host=${KMOSF_PORTAL_BASE_HOST:crm.kmosf.dev}
kmosf.portal.success-redirect=${KMOSF_PORTAL_SUCCESS_REDIRECT:/portal/}
kmosf.portal.failure-redirect=${KMOSF_PORTAL_FAILURE_REDIRECT:/portal/login}
kmosf.portal.signup-policy-default=${KMOSF_PORTAL_SIGNUP_POLICY:INVITE_ONLY}
kmosf.portal.invitation-ttl-hours=${KMOSF_PORTAL_INVITATION_TTL_HOURS:72}
kmosf.portal.magic-link-ttl-minutes=${KMOSF_PORTAL_MAGIC_LINK_TTL_MINUTES:15}
kmosf.portal.jwt-cookie-name=${KMOSF_PORTAL_JWT_COOKIE_NAME:kmosf_portal_session}
kmosf.portal.jwt-cookie-secure=${KMOSF_PORTAL_JWT_COOKIE_SECURE:true}
kmosf.portal.jwt-cookie-domain=${KMOSF_PORTAL_JWT_COOKIE_DOMAIN:}

# WebAuthn / passkey relying-party config. Origins must match the FE host(s).
kmosf.portal.webauthn.rp-id=${KMOSF_PORTAL_WEBAUTHN_RP_ID:crm.kmosf.dev}
kmosf.portal.webauthn.rp-name=${KMOSF_PORTAL_WEBAUTHN_RP_NAME:KMOSF Portal}
kmosf.portal.webauthn.allowed-origins=${KMOSF_PORTAL_WEBAUTHN_ALLOWED_ORIGINS:https://crm.kmosf.dev,https://localhost:5173}
kmosf.portal.webauthn.challenge-ttl-seconds=${KMOSF_PORTAL_WEBAUTHN_CHALLENGE_TTL_SECONDS:300}

# OAuth providers — credentials must be set via env to actually enable a provider.
# Registration is conditional on a non-blank client-id, so dev/test profiles boot
# fine without any OAuth credentials and the portal falls back to magic-link only.
# The portal flow uses a single fixed redirect per provider; tenant is carried in
# the signed `state` parameter (see PortalOAuthAuthorizationRequestResolver).
kmosf.portal.oauth.google.client-id=${KMOSF_OAUTH_GOOGLE_CLIENT_ID:}
kmosf.portal.oauth.google.client-secret=${KMOSF_OAUTH_GOOGLE_CLIENT_SECRET:}
kmosf.portal.oauth.microsoft.client-id=${KMOSF_OAUTH_MICROSOFT_CLIENT_ID:}
kmosf.portal.oauth.microsoft.client-secret=${KMOSF_OAUTH_MICROSOFT_CLIENT_SECRET:}
# Microsoft uses /common/v2.0 for multi-tenant (Entra work/school + personal MSA).
# Tokens carry a per-Azure-tenant iss; OAuthClientRegistrationConfig accepts the family.
kmosf.portal.oauth.microsoft.issuer-uri=${KMOSF_OAUTH_MICROSOFT_ISSUER:https://login.microsoftonline.com/common/v2.0}
