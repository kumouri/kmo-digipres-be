# Profile-specific test overrides — Spring profile "test", activated for the whole
# test source set via spring.profiles.active in src/test/resources/application.yml.
#
# WHY THIS FILE EXISTS
# A plain src/test/resources/application.yml does NOT override
# src/main/resources/application.properties: Spring Boot loads .properties at a
# higher precedence than .yml, so the profile-agnostic main application.properties
# wins for every key it defines. This was proven empirically — with only the
# test-yml disables, RecurringInvoiceSpawnJob was still scheduled and the Quartz
# scheduler still started in cached @SpringBootTest contexts (main
# application.properties' spring.quartz.auto-startup=true and
# kmosf.recurring-invoice.spawn-job.enabled=...:true shadowed the test yml).
# A PROFILE-SPECIFIC file (application-test.properties) reliably overrides the
# profile-agnostic main application.properties, so the toggles below are genuinely
# effective in EVERY cached test context. Per-IT @TestPropertySource still
# outranks this file (QuartzMongoJobStoreIT opts its scheduler back on).
#
# Scope: test-only. Zero production change (prod keeps the
# src/main/resources/application.properties defaults). Zero money-design change —
# recurring-billing durability lives in the RecurringInvoiceOccurrence Mongo
# ledger + nextRunAt cursor, never the Quartz JobStore.

# PRIMARY FIX: never auto-start the Quartz scheduler in tests. A non-started
# scheduler still *stores* ApplicationReadyEvent-registered jobs, but its
# scheduler thread is constructed paused and never un-paused, so NO trigger ever
# fires — hence no background RecurringInvoiceSpawnJob tick can run runDueOnce()
# cross-tenant against the ONE shared singleton Testcontainers Mongo and perturb
# another test's seeded recurring rows. This removes the *firing* capability
# outright, independent of the @ConditionalOnProperty gate below. The ONLY opt-in
# is QuartzMongoJobStoreIT (its @TestPropertySource sets auto-startup=true because
# it asserts the proof job actually fires). Prod default
# (src/main/resources/application.properties: spring.quartz.auto-startup=true) is
# UNCHANGED.
spring.quartz.auto-startup=false

# DEFENSE-IN-DEPTH: keep the @ConditionalOnProperty-gated RecurringInvoiceJobScheduler
# bean from even registering the spawn job. This is the toggle that
# src/test/resources/application.yml has long *intended* to set ("the
# sla-breach-scheduler precedent") but could not make stick due to the
# .properties-over-.yml precedence above; this profile-specific file makes it
# genuinely effective everywhere. (sla-breach-scheduler.enabled stays in the yml —
# main application.properties does not define that key, so the yml value is not
# shadowed there.)
kmosf.recurring-invoice.spawn-job.enabled=false

# BELT: a unique test-scope Quartz scheduler instance name, so a started test
# scheduler can never collide with / be looked up against another in Quartz's
# JVM-global SchedulerRepository. Effective here (profile-specific) where the
# equivalent test-yml form was shadowed by main application.properties:26. Prod
# stays KmosQuartzScheduler (src/main/resources/application.properties).
spring.quartz.properties.org.quartz.scheduler.instanceName=KmosQuartzScheduler-test

# Security fix BE-08/BE-09/BE-16 — OutboundUrlGuard test relaxation. The existing
# Documenso / GBP / webhook WireMock integration tests legitimately call
# http://localhost:<random-port>, which the production-strict guard (HTTPS required +
# loopback/private/metadata blocked) would reject. Relax both knobs for the whole test
# source set so those WireMock stubs stay reachable. A negative IT that must prove the
# guard BLOCKS an internal target overrides allow-private-networks back to false via its
# own @TestPropertySource (OutboundUrlGuardIT / DocumensoDownloadSsrfIT). Prod
# (src/main/resources/application.properties) keeps the strict defaults — zero prod change.
kmosf.outbound-guard.require-https=false
kmosf.outbound-guard.allow-private-networks=true

# Security fix BE-06 — login rate-limit test relaxation. The per-IP /auth/login throttle
# (prod default 10 / 60s) trips in the shared-context IT suite: 20+ IT classes log in from
# the same loopback IP through one cached LoginRateLimitFilter bean, so the cumulative count
# exceeds 10/min and later logins get 429 (observed on full-ci shard 2 — SyncConflictIT.login()
# at the /auth/login expectStatus().isOk()). Set a very high cap for the whole test source set
# so legitimate IT logins never trip it; a dedicated limit test can override low via its own
# @TestPropertySource. Prod (src/main/resources/application.properties, default 10/60) UNCHANGED.
kmosf.login-rate-limit.max-requests=100000
