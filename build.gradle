plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '3.3.2'
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
}

group = 'com.kumouri'
version = '0.0.1-SNAPSHOT'
description = 'kmo-digipres-be'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
    set('springCloudVersion', "2025.0.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
//    implementation 'org.springframework.boot:spring-boot-starter-integration'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // WebAuthn / passkey support. Used directly rather than Spring Security's reactive
    // WebAuthn configurer, which is too new to rely on in 6.5.x — controller-level path.
    implementation 'com.webauthn4j:webauthn4j-core:0.31.5.RELEASE'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
//    implementation 'org.apache.kafka:kafka-streams'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
//    implementation 'org.springframework.integration:spring-integration-kafka'
    implementation 'org.springframework.integration:spring-integration-mail'
//    implementation 'org.springframework.integration:spring-integration-mongodb'
//    implementation 'org.springframework.kafka:spring-kafka'
//    implementation 'org.springframework.security:spring-security-messaging'
//    implementation 'org.springframework.session:spring-session-data-mongodb'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    // Field-service module (Phase 3) — opt-in via kmosf.modules.field-service.enabled
    implementation 'org.mnode.ical4j:ical4j:4.0.4'
    implementation platform('software.amazon.awssdk:bom:2.29.20')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:auth'
    // Phase 4 — calendar/imports/templates/reports
    implementation 'com.samskivert:jmustache:1.16'
    implementation 'org.apache.commons:commons-csv:1.11.0'
    // Phase 7 — quote/invoice PDF generation (OpenPDF: iText fork, MPL/LGPL)
    implementation 'com.github.librepdf:openpdf:2.0.3'
    // Phase 11c — lead scoring v2. Smile is a pure-Java ML library; all CPU-bound
    // calls (training, prediction) must be wrapped in Schedulers.boundedElastic().
    implementation 'com.github.haifengl:smile-core:3.1.0'
    // Phase A — OpenAPI / Springdoc (WebFlux variant)
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.6.0'
    // Phase A (A.5) — Quartz Mongo JobStore.
    // NOTE: com.github.quartz-mongodb:quartz-mongodb:2.2.0-rc1 (plan coordinate) did not
    // resolve at implementation time. The community library lives at:
    //   https://github.com/michaelklishin/quartz-mongodb
    // Pending coordinate verification in CI; using RAM store as fallback for Phase A proof job.
    // TODO(Phase-E): resolve coordinates and swap from RAM to Mongo store before Phase E
    //   invoice/payment idempotency adoption of @Scheduled-based jobs.
    // implementation 'com.github.quartz-mongodb:quartz-mongodb:2.2.0-rc1'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
//    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
//    runtimeOnly 'io.micrometer:micrometer-registry-otlp'
    // Annotation-processor order matters: Lombok first so MapStruct sees the generated
    // getters/setters. lombok-mapstruct-binding teaches MapStruct about Lombok.
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.integration:spring-integration-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-webtestclient'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:mongodb'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'org.wiremock:wiremock-standalone:3.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('bootBuildImage') {
    runImage = 'paketobuildpacks/ubuntu-noble-run-base:latest'
}

tasks.named('test') {
    outputs.dir snippetsDir
    useJUnitPlatform()
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    dependsOn test
}

// Phase A — OpenAPI drift gate.
// generateOpenApiDocs (from org.springdoc.openapi-gradle-plugin) boots the app and
// emits the spec to build/openapi.json.  verifyOpenApi normalises both the committed
// file and the generated file (sort keys, strip whitespace) and fails the build when
// they differ so spec drift is caught on every PR.
openApi {
    outputDir = layout.buildDirectory.dir("openapi")
    outputFileName = "openapi.json"
    // The plugin starts the app on a random port; pass Testcontainers-free settings
    // so it does not require a live database (Springdoc only introspects routes).
    customBootRun {
        args = [
            "--spring.data.mongodb.uri=mongodb://localhost:27017/",
            "--spring.data.mongodb.auto-index-creation=false",
            "--kmosf.mail.smtp.password=test",
            "--spring.quartz.auto-startup=false",
            "--kmosf.quartz.proof-job.enabled=false"
        ]
    }
}

tasks.register('verifyOpenApi') {
    description = 'Fails the build if docs/api/openapi.json has drifted from the generated spec.'
    group = 'verification'
    dependsOn 'generateOpenApiDocs'
    doLast {
        def committed = file('docs/api/openapi.json')
        def generated = layout.buildDirectory.file('openapi/openapi.json').get().asFile
        if (!committed.exists()) {
            throw new GradleException(
                "docs/api/openapi.json does not exist. Run ./gradlew generateOpenApiDocs, " +
                "copy build/openapi/openapi.json to docs/api/openapi.json, and commit it.")
        }
        if (!generated.exists()) {
            throw new GradleException(
                "Generated spec not found at ${generated}. generateOpenApiDocs may have failed.")
        }
        def normalize = { String s -> s.replaceAll(/\s+/, ' ').trim() }
        def c = normalize(committed.text)
        def g = normalize(generated.text)
        if (c != g) {
            throw new GradleException(
                "OpenAPI spec drift detected! The committed docs/api/openapi.json does not match " +
                "the spec generated from the running application.\n" +
                "To fix: run ./gradlew generateOpenApiDocs, review the diff " +
                "(diff docs/api/openapi.json build/openapi/openapi.json), " +
                "copy build/openapi/openapi.json to docs/api/openapi.json, and commit.")
        }
        println "verifyOpenApi: docs/api/openapi.json matches the generated spec. OK."
    }
}

tasks.named('check') {
    dependsOn 'verifyOpenApi'
}
