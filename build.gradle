plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '3.3.2'
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
}

group = 'com.kumouri'
version = '0.0.1-SNAPSHOT'
description = 'kmo-digipres-be'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
    set('springCloudVersion', "2025.0.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
//    implementation 'org.springframework.boot:spring-boot-starter-integration'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // WebAuthn / passkey support. Used directly rather than Spring Security's reactive
    // WebAuthn configurer, which is too new to rely on in 6.5.x — controller-level path.
    implementation 'com.webauthn4j:webauthn4j-core:0.31.5.RELEASE'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
//    implementation 'org.apache.kafka:kafka-streams'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
//    implementation 'org.springframework.integration:spring-integration-kafka'
    implementation 'org.springframework.integration:spring-integration-mail'
//    implementation 'org.springframework.integration:spring-integration-mongodb'
//    implementation 'org.springframework.kafka:spring-kafka'
//    implementation 'org.springframework.security:spring-security-messaging'
//    implementation 'org.springframework.session:spring-session-data-mongodb'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    // Field-service module (Phase 3) — opt-in via kmosf.modules.field-service.enabled
    implementation 'org.mnode.ical4j:ical4j:4.0.4'
    implementation platform('software.amazon.awssdk:bom:2.29.20')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:auth'
    // Phase 4 — calendar/imports/templates/reports
    implementation 'com.samskivert:jmustache:1.16'
    implementation 'org.apache.commons:commons-csv:1.11.0'
    // Phase 7 — quote/invoice PDF generation (OpenPDF: iText fork, MPL/LGPL)
    implementation 'com.github.librepdf:openpdf:2.0.3'
    // Phase 11c — lead scoring v2. Smile is a pure-Java ML library; all CPU-bound
    // calls (training, prediction) must be wrapped in Schedulers.boundedElastic().
    implementation 'com.github.haifengl:smile-core:3.1.0'
    // Phase A — OpenAPI / Springdoc (WebFlux variant)
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.6.0'
    // Phase E (E-D5) — Quartz Mongo JobStore: COORDINATE RESOLVES, LIBRARY IS
    // NON-FUNCTIONAL under this stack → E-D5 RAM-FALLBACK TAKEN (the plan-authorized
    // outcome for exactly this case; the plan does NOT block on the dependency).
    //
    // io.fluidsonic.mirror:quartz-mongodb:2.2.0-rc2 (Maven-Central mirror of the
    // JCenter-sunset com.novemberain library) DOES resolve and the Mongo store DOES
    // load (com.novemberain.quartz.mongodb.MongoDBJobStore + CheckinExecutor start).
    // BUT it was compiled against org.quartz-scheduler:quartz:2.3.2 and Spring Boot
    // 3.5.6 manages Quartz 2.5.0, which removed JobDetail.isConcurrentExectionDisallowed()
    // (historic typo). On EVERY trigger fire the Mongo store throws:
    //   java.lang.NoSuchMethodError:
    //     'boolean org.quartz.JobDetail.isConcurrentExectionDisallowed()'
    //     at com.novemberain.quartz.mongodb.LockManager.lockJob(LockManager.java:31)
    //     at com.novemberain.quartz.mongodb.TriggerRunner.triggersFired(...)
    //     at com.novemberain.quartz.mongodb.MongoDBJobStore.triggersFired(...)
    // i.e. NO Quartz job ever executes under the Mongo store. Pinning Quartz back to
    // 2.3.2 would fight the Boot BOM and risk the 8 shipped @Scheduled / Quartz-classpath
    // services (R3). The fluidsonic mirror has no 2.5-compatible release.
    //
    // E-D5 RAM-FALLBACK (kmosf.quartz.store=memory, default in application.properties):
    // money-durability of recurring billing does NOT depend on a durable JobStore —
    // it depends on "which periods were already spawned" surviving restart, which is
    // guaranteed by the RecurringInvoiceOccurrence unique-indexed Mongo ledger +
    // RecurringInvoice.nextRunAt cursor (E-D2/E-D3). A stateless RAM-store trigger that
    // re-runs runDueOnce() hourly reconciles from that ledger on every tick (bounded
    // catch-up) — exactly the ServiceAgreementSchedulerService model. Fully money-correct.
    // RecurringInvoiceSpawnRestartIT is the durability proof; QuartzMongoJobStoreIT
    // documents the fallback (RAM store; proof job still fires).
    //
    // Dependency intentionally NOT added: it is non-functional dead weight that would
    // also drag mongodb-driver-sync:4.0.5 onto the classpath. Re-evaluate if a
    // Quartz-2.5-compatible quartz-mongodb (or a Quartz 2.5 store SPI shim) appears.
    // implementation 'io.fluidsonic.mirror:quartz-mongodb:2.2.0-rc2'  // NOSONAR — see above
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
//    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
//    runtimeOnly 'io.micrometer:micrometer-registry-otlp'
    // Annotation-processor order matters: Lombok first so MapStruct sees the generated
    // getters/setters. lombok-mapstruct-binding teaches MapStruct about Lombok.
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.integration:spring-integration-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-webtestclient'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:mongodb'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'org.wiremock:wiremock-standalone:3.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        // Override the Spring Boot 3.5.6-managed Testcontainers (1.21.3): too old for
        // Docker Engine 29 (docker-java 3.4.2 → HTTP 400 on /info). 2.x bundles a
        // docker-java that speaks the Docker 29 API. Declared after the Boot BOM so it
        // wins the version for all org.testcontainers:* artifacts.
        mavenBom "org.testcontainers:testcontainers-bom:2.0.5"
    }
}

tasks.named('bootBuildImage') {
    runImage = 'paketobuildpacks/ubuntu-noble-run-base:latest'
}

tasks.named('test') {
    outputs.dir snippetsDir
    useJUnitPlatform()
    // Single forked JVM (Gradle default: forkEvery=0, maxParallelForks=1) is REQUIRED
    // so the static singleton Testcontainers (TestcontainersConfiguration) are shared
    // across every @SpringBootTest context — multiple forks would mean multiple
    // singletons => many containers again. Heap bump: ~22 distinct @TestPropertySource
    // variants keep many reactive Spring contexts in the TestContext cache.
    maxHeapSize = '1600m'

    // F.12 — deterministic class-shard filter for CI matrix runs.
    // Each CI job passes -Dtest.shard.total=6 -Dtest.shard.index=<1..6> so that each
    // runner runs only its 1/6 of the test classes against its own isolated Docker /
    // Testcontainers Mongo.  Local runs (no system properties set) are unaffected:
    // shardTotal defaults to 1 => the exclude closure is never evaluated.
    // maxParallelForks is deliberately NOT set here — the single-fork invariant is
    // preserved (see comment above); sharding is across separate CI jobs, not JVM forks.
    def shardTotal = (System.getProperty('test.shard.total') ?: '1') as int
    def shardIndex = (System.getProperty('test.shard.index') ?: '1') as int   // 1-based
    if (shardTotal > 1) {
        exclude { org.gradle.api.file.FileTreeElement fte ->
            if (fte.isDirectory()) return false
            def path = fte.relativePath.pathString
            if (!path.endsWith('.class') || path.contains('$')) return false   // only top-level test classes decide bucketing
            int bucket = Math.floorMod(path.replace('/', '.').hashCode(), shardTotal) + 1
            return bucket != shardIndex   // exclude classes that are NOT in this shard
        }
    }
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    dependsOn test
}

// Phase A — OpenAPI drift gate (bootstrap-tolerant).
//
// The spec is exported by OpenApiEndpointIT during the Testcontainers test phase
// (the only place a Mongo-backed app actually boots in CI) to build/openapi/openapi.json.
// verifyOpenApi consumes that file — it does NOT depend on the springdoc gradle
// plugin's generateOpenApiDocs (that forks a full app boot and has no DB in CI).
//
// Behaviour:
//   * committed spec missing            -> fail (genuine misconfiguration)
//   * committed spec is the bootstrap   -> never fail; if a generated spec exists,
//     placeholder (x-kmosf-spec-status)    refresh docs/api/openapi.json from it and
//                                          tell the dev to commit; else warn + pass
//   * committed spec is real, generated -> strict normalised drift compare (fail on drift)
//     spec present
//   * committed spec is real, generated -> warn + pass (drift check skipped; this env
//     spec absent (no Docker/tests)        could not produce a spec — CI still enforces)
//
// The springdoc openApi {} block below is retained for OPTIONAL manual local
// generation only (./gradlew generateOpenApiDocs, where a DB is reachable); it is
// no longer on the check/build path.
openApi {
    outputDir = layout.buildDirectory.dir("openapi")
    outputFileName = "openapi.json"
    // The plugin starts the app on a random port; pass Testcontainers-free settings
    // so it does not require a live database (Springdoc only introspects routes).
    customBootRun {
        args = [
            "--spring.data.mongodb.uri=mongodb://localhost:27017/",
            "--spring.data.mongodb.auto-index-creation=false",
            "--kmosf.mail.smtp.password=test",
            "--spring.quartz.auto-startup=false",
            "--kmosf.quartz.proof-job.enabled=false"
        ]
    }
}

tasks.register('verifyOpenApi') {
    description = 'Refreshes docs/api/openapi.json from the spec exported by OpenApiEndpointIT (advisory in Phase A).'
    group = 'verification'
    // Runs after :test (OpenApiEndpointIT exports build/openapi/openapi.json during the
    // Testcontainers phase). NOT dependsOn generateOpenApiDocs — that springdoc plugin
    // task forks a full app boot and has no database in CI.
    //
    // ADVISORY in Phase A — never fails the build. springdoc output is non-deterministic
    // across JVM runs (duplicate-method operationId "_1"/"_2" suffixes assigned by
    // traversal order, plus map key ordering), so a strict byte/structural drift gate
    // false-fails on essentially every run while providing negative value. Instead we
    // always refresh the committed spec so docs/api/openapi.json stays accurate for
    // Phase B FE codegen, and log when it changed. A strict drift gate is DEFERRED to
    // Phase B, contingent on first making operationIds deterministic
    // (explicit @Operation(operationId=...)). See plan back-office-kmo-digipres-phase-A §A.1/§10.
    mustRunAfter 'test'
    doLast {
        def committed = file('docs/api/openapi.json')
        def generated = layout.buildDirectory.file('openapi/openapi.json').get().asFile
        if (!generated.exists()) {
            println "verifyOpenApi: WARNING — no generated spec at ${generated} (tests did not " +
                    "run / Docker unavailable here). Skipping refresh; CI regenerates it. Passing."
            return
        }
        def newText = generated.text
        if (!committed.exists() || committed.text != newText) {
            committed.parentFile.mkdirs()
            committed.write(newText)
            println "verifyOpenApi: refreshed docs/api/openapi.json from the generated spec — " +
                    "COMMIT it so Phase B FE codegen stays in sync. (Advisory in Phase A; not a build failure.)"
        } else {
            println "verifyOpenApi: docs/api/openapi.json already matches the generated spec. OK."
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyOpenApi'
}
